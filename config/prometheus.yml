global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'stdf-wafer-map-yield-predictor'
    environment: 'local'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'fastapi'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
