api:
  title: "Wafer Pattern Classifier API"
  version: "2.0.0"
  description: "Hash-verified synthetic wafer-pattern classification reference"
  host: "0.0.0.0"
  port: 8000
  reload: false
  cors:
    allow_origins: ["http://localhost:3000", "http://localhost:5173"]
  rate_limit:
    per_minute: 100

model:
  production_model_path: "models/onnx/public_synthetic_resnet18_v1.onnx"
  metadata_path: "models/public_synthetic_resnet18_v1.json"
  evidence_path: "evidence/public_synthetic_evaluation.json"
  task: "synthetic wafer-pattern classification"

upload:
  max_file_size_mb: 10
  allowed_content_types: ["image/png", "image/jpeg"]

security:
  production_api_key_environment_variable: "WAFER_CLASSIFIER_API_KEY"

monitoring:
  prometheus_path: "/metrics"
