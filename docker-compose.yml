services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      APP_ENV: production
      WAFER_CLASSIFIER_API_KEY: ${WAFER_CLASSIFIER_API_KEY:?Set WAFER_CLASSIFIER_API_KEY}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/readiness', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
