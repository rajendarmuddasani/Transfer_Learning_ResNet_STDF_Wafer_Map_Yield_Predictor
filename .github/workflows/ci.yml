name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-evidence.txt
      - name: Lint
        run: ruff check src scripts tests --select E,W,F --ignore E501
      - name: Test
        run: |
          pytest tests -v --tb=short -x \
            --cov=src --cov-report=term-missing --cov-report=xml
      - name: Validate static evidence
        run: python scripts/validate_evidence.py
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install evidence environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-evidence.txt
      - name: Recompute grouped selection and confirmation
        run: python scripts/validate_evidence.py --recompute

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high

  container:
    needs: [test, evidence, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build non-root API image
        run: docker build -f docker/Dockerfile.api -t wafer-classifier:${{ github.sha }} .
      - name: Authenticated runtime smoke
        env:
          IMAGE: wafer-classifier:${{ github.sha }}
          API_KEY: ci-smoke-only
        run: |
          docker run --detach --name wafer-classifier-smoke \
            --env APP_ENV=production \
            --env WAFER_CLASSIFIER_API_KEY="${API_KEY}" \
            --publish 8000:8000 \
            "${IMAGE}"
          trap 'docker rm --force wafer-classifier-smoke >/dev/null 2>&1' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/readiness \
              | grep --quiet '"status":"ready"'; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              docker logs wafer-classifier-smoke
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent \
            --header "X-API-Key: ${API_KEY}" \
            http://127.0.0.1:8000/api/v1/models \
            | grep --quiet '"model_id":"public_synthetic_resnet18_v1"'
